name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-terminal mkdocs-minify-plugin

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Package skills
        run: zip -r chainlink-skills.zip chainlink blink vide

      - name: Upload skills artifact
        uses: actions/upload-artifact@v7
        with:
          name: chainlink-skills
          path: chainlink-skills.zip
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download skills artifact
        uses: actions/download-artifact@v5
        with:
          name: chainlink-skills
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/chainlink-skills.zip
